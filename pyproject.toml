[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openperfusion"
version = "0.3.0"
description = "OpenPerfusion: open-source CT perfusion pipeline for acute stroke (research use only, not for clinical decision-making)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Will Scott"}]
keywords = ["CT perfusion", "stroke", "deconvolution", "Tmax", "neuroimaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "nibabel>=5.0", "scikit-image>=0.21"]

[project.urls]
Repository = "https://github.com/OpenPerfusion/OpenPerfusion"
Issues = "https://github.com/OpenPerfusion/OpenPerfusion/issues"
Discussions = "https://github.com/OpenPerfusion/OpenPerfusion/discussions"

[project.optional-dependencies]
dicom = ["pydicom>=2.4", "pylibjpeg", "pylibjpeg-libjpeg"]
register = ["SimpleITK>=2.3"]
dev = ["pytest>=7"]

[project.scripts]
openperfusion = "openperfusion.cli:main"

[tool.setuptools.packages.find]
include = ["openperfusion*"]
