[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openperfusion"
version = "0.1.0"
description = "OpenPerfusion: open-source CT perfusion pipeline for acute stroke (research use only, not for clinical decision-making)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "nibabel>=5.0", "scikit-image>=0.21"]

[project.optional-dependencies]
dicom = ["pydicom>=2.4"]
dev = ["pytest>=7"]

[project.scripts]
openperfusion = "openperfusion.cli:main"

[tool.setuptools.packages.find]
include = ["openperfusion*"]
